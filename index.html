<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ping Pong Duel</title>
  <style>
    :root {
      --ink: #10212b;
      --muted: #5d7079;
      --paper: #f5f1e8;
      --table: #176b68;
      --table-dark: #0e4d4c;
      --line: #d9f2de;
      --orange: #ef7958;
      --yellow: #f4c95d;
      --white: #fffdf8;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: var(--paper);
      font-family: Georgia, "Times New Roman", serif;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(900px, 100%);
    }

    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 6vw, 4.5rem);
      line-height: .9;
      letter-spacing: 0;
    }

    .tagline {
      margin: 0 0 5px;
      color: var(--muted);
      font: 700 .78rem/1.2 Arial, sans-serif;
      letter-spacing: .12em;
      text-transform: uppercase;
      text-align: right;
    }

    .scoreboard {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 20px;
      margin-bottom: 14px;
    }

    .score {
      display: flex;
      align-items: baseline;
      gap: 12px;
      font: 700 1rem Arial, sans-serif;
      text-transform: uppercase;
    }

    .score.right { justify-content: end; }

    .score strong {
      font: 700 clamp(2.8rem, 8vw, 5.5rem)/.8 Georgia, serif;
    }

    .score.left strong { color: var(--orange); }
    .score.right strong { color: var(--table); }

    .round {
      color: var(--muted);
      font: 700 .7rem Arial, sans-serif;
      letter-spacing: .1em;
      text-align: center;
      text-transform: uppercase;
    }

    .court-wrap {
      position: relative;
      padding: 10px;
      background: var(--ink);
      box-shadow: 10px 10px 0 var(--yellow);
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 9;
      background: var(--table);
    }

    .status {
      min-height: 1.4em;
      margin: 18px 0 10px;
      color: var(--muted);
      font: 700 .85rem Arial, sans-serif;
      text-align: center;
    }

    .actions {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .speed-control {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font: 700 .8rem Arial, sans-serif;
      text-transform: uppercase;
    }

    select {
      border: 2px solid var(--ink);
      padding: 11px 12px;
      color: var(--ink);
      background: var(--white);
      font: 700 .8rem Arial, sans-serif;
    }

    input {
      width: 128px;
      border: 2px solid var(--ink);
      padding: 11px 12px;
      color: var(--ink);
      background: var(--white);
      font: 700 .8rem Arial, sans-serif;
    }

    button {
      border: 0;
      padding: 13px 18px;
      color: var(--white);
      background: var(--ink);
      cursor: pointer;
      font: 700 .8rem Arial, sans-serif;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    button:hover, button:focus-visible { background: var(--orange); }

    footer {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      margin-top: 18px;
      color: var(--muted);
      font: .8rem/1.4 Arial, sans-serif;
    }

    @media (max-width: 600px) {
      body { padding: 16px; }
      header { align-items: start; flex-direction: column; gap: 10px; }
      .tagline { text-align: left; }
      .scoreboard { gap: 8px; }
      .score { display: block; font-size: .7rem; }
      .score strong { display: block; margin-top: 8px; }
      .score.right { text-align: right; }
      footer { flex-direction: column; text-align: center; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Ping Pong Duel</h1>
      <p class="tagline">Two players · one table · first to 11</p>
    </header>

    <section class="scoreboard" aria-label="Scoreboard">
      <div class="score left"><span id="leftName">Player 1</span><strong id="leftScore">0</strong></div>
      <div class="round" id="roundLabel">Ready</div>
      <div class="score right"><strong id="rightScore">0</strong><span id="rightName">Player 2</span></div>
    </section>

    <div class="court-wrap">
      <canvas id="court" width="800" height="450" tabindex="0" aria-label="Ping pong game area"></canvas>
    </div>

    <p class="status" id="status">Press an arrow key or Q/A to serve.</p>
    <div class="actions">
      <label class="speed-control" for="player1Input">Player 1
        <input id="player1Input" type="text" value="Player 1" aria-label="Player 1 name">
      </label>
      <label class="speed-control" for="player2Input">Player 2
        <input id="player2Input" type="text" value="Player 2" aria-label="Player 2 name">
      </label>
      <label class="speed-control" for="opponentSelect">Player 2
        <select id="opponentSelect" aria-label="Player 2 mode">
          <option value="human">Human</option>
          <option value="computer">Computer</option>
        </select>
      </label>
      <label class="speed-control" for="speedSelect">Speed
        <select id="speedSelect" aria-label="Ball speed">
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
        </select>
      </label>
      <button id="start" type="button">Start game</button>
      <button id="restart" type="button">Restart game</button>
    </div>

    <footer>
      <span>Player 1: Q / A</span>
      <span>Player 2: Arrow Up / Arrow Down</span>
    </footer>
  </main>

  <script>
    const canvas = document.getElementById('court');
    const context = canvas.getContext('2d');
    const leftScore = document.getElementById('leftScore');
    const rightScore = document.getElementById('rightScore');
    const leftName = document.getElementById('leftName');
    const rightName = document.getElementById('rightName');
    const roundLabel = document.getElementById('roundLabel');
    const status = document.getElementById('status');
    const startButton = document.getElementById('start');
    const restartButton = document.getElementById('restart');
    const player1Input = document.getElementById('player1Input');
    const player2Input = document.getElementById('player2Input');
    const opponentSelect = document.getElementById('opponentSelect');
    const speedSelect = document.getElementById('speedSelect');

    const table = { width: canvas.width, height: canvas.height };
    const paddle = { width: 14, height: 92, speed: 7 };
    const left = { x: 28, y: table.height / 2 - paddle.height / 2, score: 0 };
    const right = { x: table.width - 42, y: table.height / 2 - paddle.height / 2, score: 0 };
    const ball = { x: table.width / 2, y: table.height / 2, radius: 9, speed: 5, dx: 0, dy: 0 };
    const keys = new Set();
    let running = false;
    let gameOver = false;
    let started = false;
    let speedLevel = 1;
    let opponentMode = 'human';

    function selectedSpeed() {
      return 5 + (speedLevel - 1) * 1;
    }

    function resetBall(direction = 1) {
      ball.x = table.width / 2;
      ball.y = table.height / 2;
      ball.speed = selectedSpeed();
      ball.dx = direction * ball.speed;
      ball.dy = (Math.random() * 2 - 1) * ball.speed * 0.6;
      running = true;
      roundLabel.textContent = 'Live';
      status.textContent = 'Keep your eye on the ball.';
    }

    function resetGame() {
      left.score = 0;
      right.score = 0;
      left.y = table.height / 2 - paddle.height / 2;
      right.y = table.height / 2 - paddle.height / 2;
      gameOver = false;
      started = false;
      running = false;
      ball.dx = 0;
      ball.dy = 0;
      updateScore();
      roundLabel.textContent = 'Ready';
      startButton.disabled = false;
      player1Input.disabled = false;
      player2Input.disabled = false;
      status.textContent = 'Enter names, then press Start game.';
    }

    function updateScore() {
      leftScore.textContent = left.score;
      rightScore.textContent = right.score;
    }

    function updatePlayerNames() {
      leftName.textContent = player1Input.value.trim() || 'Player 1';
      rightName.textContent = player2Input.value.trim() || 'Player 2';
    }

    function movePaddles() {
      if (keys.has('KeyQ')) left.y -= paddle.speed;
      if (keys.has('KeyA')) left.y += paddle.speed;
      if (opponentMode === 'human') {
        if (keys.has('ArrowUp')) right.y -= paddle.speed;
        if (keys.has('ArrowDown')) right.y += paddle.speed;
      } else {
        moveComputerPaddle();
      }
      left.y = Math.max(0, Math.min(table.height - paddle.height, left.y));
      right.y = Math.max(0, Math.min(table.height - paddle.height, right.y));
    }

    function moveComputerPaddle() {
      const target = ball.dx > 0 ? ball.y - paddle.height / 2 : table.height / 2 - paddle.height / 2;
      const difference = target - right.y;
      right.y += Math.max(-paddle.speed * 0.7, Math.min(paddle.speed * 0.7, difference));
    }

    function hitsPaddle(player) {
      return ball.x - ball.radius < player.x + paddle.width &&
        ball.x + ball.radius > player.x &&
        ball.y - ball.radius < player.y + paddle.height &&
        ball.y + ball.radius > player.y;
    }

    function scorePoint(player) {
      player.score += 1;
      updateScore();
      if (player.score >= 11) {
        gameOver = true;
        running = false;
        roundLabel.textContent = 'Winner';
        status.textContent = `${player === left ? leftName.textContent : rightName.textContent} wins! Press Restart game to play again.`;
        return;
      }
      running = false;
      roundLabel.textContent = 'Point';
      status.textContent = 'Press a movement key to serve the next point.';
      ball.dx = 0;
      ball.dy = 0;
      setTimeout(() => { if (!gameOver) resetBall(player === left ? -1 : 1); }, 500);
    }

    function updateBall() {
      if (!running || gameOver) return;
      ball.x += ball.dx;
      ball.y += ball.dy;

      if (ball.y - ball.radius <= 0 || ball.y + ball.radius >= table.height) {
        ball.dy *= -1;
        ball.y = Math.max(ball.radius, Math.min(table.height - ball.radius, ball.y));
      }

      if (ball.dx < 0 && hitsPaddle(left)) {
        ball.x = left.x + paddle.width + ball.radius;
        ball.dx = Math.abs(ball.dx) + 0.25;
        ball.dy += (ball.y - (left.y + paddle.height / 2)) * 0.08;
      }
      if (ball.dx > 0 && hitsPaddle(right)) {
        ball.x = right.x - ball.radius;
        ball.dx = -Math.abs(ball.dx) - 0.25;
        ball.dy += (ball.y - (right.y + paddle.height / 2)) * 0.08;
      }

      if (ball.x < -ball.radius) scorePoint(right);
      if (ball.x > table.width + ball.radius) scorePoint(left);
    }

    function draw() {
      context.clearRect(0, 0, table.width, table.height);
      context.fillStyle = '#176b68';
      context.fillRect(0, 0, table.width, table.height);
      context.fillStyle = 'rgba(14, 77, 76, .55)';
      context.fillRect(0, 0, table.width / 2, table.height);

      context.strokeStyle = '#d9f2de';
      context.setLineDash([12, 16]);
      context.lineWidth = 4;
      context.beginPath();
      context.moveTo(table.width / 2, 0);
      context.lineTo(table.width / 2, table.height);
      context.stroke();
      context.setLineDash([]);

      context.fillStyle = '#ef7958';
      context.fillRect(left.x, left.y, paddle.width, paddle.height);
      context.fillStyle = '#f4c95d';
      context.fillRect(right.x, right.y, paddle.width, paddle.height);

      context.fillStyle = '#fffdf8';
      context.beginPath();
      context.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
      context.fill();
    }

    function loop() {
      movePaddles();
      updateBall();
      draw();
      requestAnimationFrame(loop);
    }

    window.addEventListener('keydown', event => {
      const key = event.code;
      if (!started || !['ArrowUp', 'ArrowDown', 'KeyQ', 'KeyA'].includes(key)) return;
      event.preventDefault();
      keys.add(key);
      if (!running && !gameOver) resetBall(ball.dx < 0 ? -1 : 1);
    });

    window.addEventListener('keyup', event => {
      keys.delete(event.code);
    });

    startButton.addEventListener('click', () => {
      updatePlayerNames();
      started = true;
      startButton.disabled = true;
      player1Input.disabled = true;
      player2Input.disabled = true;
      canvas.focus();
      resetBall(1);
    });
    restartButton.addEventListener('click', resetGame);
    player1Input.addEventListener('input', updatePlayerNames);
    player2Input.addEventListener('input', updatePlayerNames);
    opponentSelect.addEventListener('change', event => {
      opponentMode = event.target.value;
      right.y = table.height / 2 - paddle.height / 2;
      status.textContent = opponentMode === 'computer'
        ? 'Computer opponent selected. Press a movement key to serve.'
        : 'Two-player mode selected. Press a movement key to serve.';
    });
    speedSelect.addEventListener('change', event => {
      speedLevel = Number(event.target.value);
      status.textContent = `Speed ${speedLevel} selected. It applies on the next serve.`;
    });
    updatePlayerNames();
    resetGame();
    loop();
  </script>
</body>
</html>
